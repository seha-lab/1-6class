<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-6 사이트 점검중</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #202124;
        }

        .container {
            text-align: center;
            padding: 40px 25px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
        }

        p {
            margin: 8px 0;
            color: #666;
            font-size: 16px;
        }

        .notice {
            margin-top: 25px;
            padding: 12px 20px;
            display: inline-block;
            border-radius: 10px;
            background: #e9eef6;
            color: #4b5563;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🔧</div>

        <h1>1-6 사이트 점검중</h1>

        <p>현재 사이트를 점검하고 있습니다.</p>
        <p>잠시 후 다시 접속해주세요.</p>

        <div class="notice">
            이용에 불편을 드려 죄송합니다.
        </div>
    </main>
</body>
</html>
